name: Build Lithium for Windows

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package Lithium x64
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Check out Lithium source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test Lithium source
        run: npm test

      - name: Fetch search shortcuts
        run: npm run fetch-bangs

      - name: Build Windows installer and portable app
        run: npm run package:win:offline-seed

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: lithium-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
